<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Deep Indigo Circle Gradient -->
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Styled Background Circle -->
  <circle cx="256" cy="256" r="230" fill="url(#circleGradient)" filter="url(#softShadow)" />

  <!-- Stylish Glowing Ring Accent -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#borderGradient)" stroke-width="10" opacity="0.9" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2" />

  <!-- Stylized Underline Arc inside Circle -->
  <path d="M 116 296 Q 256 322 396 296" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
  <circle cx="256" cy="309" r="4.5" fill="#38bdf8" />

  <!-- Styled Bold 'Clientify' Text inside Circle -->
  <text x="256" y="270" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-weight="900" 
        font-size="68" 
        letter-spacing="-1">
    <tspan fill="#ffffff">Client</tspan><tspan fill="#38bdf8">ify</tspan>
  </text>
</svg>
