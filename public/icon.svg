<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Outer Vault Circle Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="12" stroke-dasharray="24 12" />

  <!-- Stylized C Shield Vault Path -->
  <path d="M 256 128 
           C 180 128, 128 180, 128 256 
           C 128 332, 180 384, 256 384 
           C 316 384, 360 348, 376 296 
           L 308 296 
           C 298 320, 280 332, 256 332 
           C 214 332, 180 298, 180 256 
           C 180 214, 214 180, 256 180 
           C 280 180, 298 192, 308 216 
           L 376 216 
           C 360 164, 316 128, 256 128 Z" 
        fill="url(#cGrad)" />

  <!-- Connected Intelligence Node Spark -->
  <circle cx="360" cy="256" r="28" fill="url(#accentGrad)" />
  <circle cx="360" cy="256" r="12" fill="#ffffff" />

  <!-- Interconnecting Cyber Shield Line -->
  <path d="M 320 256 L 332 256" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" />
</svg>
