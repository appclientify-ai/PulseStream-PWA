<!DOCTYPE html>
<html lang="en" class="font-sans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Clientify | Practice Intelligence Operating System</title>
    <meta name="description" content="Master your practice with Clientify. The high-performance vault for professional tax consultants." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Quicksand:wght@500;700;800&family=Roboto+Condensed:wght@400;700;900&family=Playfair+Display:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: 'var(--app-primary, #4f46e5)',
              secondary: 'var(--app-primary-hover, #6366f1)',
              accent: '#f59e0b',
              surface: '#ffffff',
              glass: 'rgba(255, 255, 255, 0.7)',
            },
            boxShadow: {
              'glass-silk': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
            },
            animation: {
              'pulse-priority': 'pulse-priority 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              'pulse-priority': {
                '0%, 100%': { opacity: 1, transform: 'scale(1)' },
                '50%': { opacity: .7, transform: 'scale(1.05)' },
              },
              'float': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --ui-font-size: 16px;
        --ui-font-size-num: 16;
        --app-primary: #4f46e5;
        --app-primary-hover: #4338ca;
        --app-primary-light: #e0e7ff;
        --app-primary-text: #4f46e5;
        --app-primary-ring: rgba(79, 70, 229, 0.25);
        --app-bg: #fcfdfe;
        --app-text: #0f172a;
        --app-card-bg: #ffffff;
        --app-font-size: var(--ui-font-size, 16px);
      }
      html { font-size: var(--ui-font-size, 16px) !important; scroll-behavior: smooth; }
      body, #root {
        font-size: var(--ui-font-size, 16px) !important;
        background-color: var(--app-bg, #fcfdfe);
        color: var(--app-text, #0f172a);
        -webkit-tap-highlight-color: transparent;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      .text-xs { font-size: max(12px, calc(0.75rem * (var(--ui-font-size-num, 16) / 16))) !important; }
      .text-sm { font-size: max(13.5px, calc(0.875rem * (var(--ui-font-size-num, 16) / 16))) !important; }
      .text-base { font-size: max(14.5px, calc(1rem * (var(--ui-font-size-num, 16) / 16))) !important; }
      .text-lg { font-size: max(16px, calc(1.125rem * (var(--ui-font-size-num, 16) / 16))) !important; }
      .text-xl { font-size: max(18px, calc(1.25rem * (var(--ui-font-size-num, 16) / 16))) !important; }

      .text-\[8px\] { font-size: max(11px, calc(0.5rem * (var(--ui-font-size-num, 16) / 16))) !important; }
      .text-\[9px\] { font-size: max(11.5px, calc(0.5625rem * (var(--ui-font-size-num, 16) / 16))) !important; }
      .text-\[10px\] { font-size: max(12px, calc(0.625rem * (var(--ui-font-size-num, 16) / 16))) !important; }
      .text-\[11px\] { font-size: max(12.5px, calc(0.6875rem * (var(--ui-font-size-num, 16) / 16))) !important; }
      .text-\[12px\] { font-size: max(13px, calc(0.75rem * (var(--ui-font-size-num, 16) / 16))) !important; }
      .text-\[13px\] { font-size: max(13.5px, calc(0.8125rem * (var(--ui-font-size-num, 16) / 16))) !important; }
      .text-\[14px\] { font-size: max(14px, calc(0.875rem * (var(--ui-font-size-num, 16) / 16))) !important; }
      .text-\[15px\] { font-size: max(15px, calc(0.9375rem * (var(--ui-font-size-num, 16) / 16))) !important; }

      /* Outside table minimum font size protection for Sidebar, Header, Search, Badges & Controls */
      aside h5, aside button, aside span,
      header h2, header p, header button, header span,
      .search-container, input[type="text"], input[type="search"] {
        min-font-size: 12px;
      }


      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.04);
      }

      /* Typography Font Styles Applicable Across Whole App */
      body.app-font-sans, .app-font-sans { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important; }
      body.app-font-serif, .app-font-serif { font-family: 'Playfair Display', ui-serif, Georgia, Cambria, "Times New Roman", Times, serif !important; }
      body.app-font-mono, .app-font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important; }
      body.app-font-rounded, .app-font-rounded { font-family: 'Quicksand', system-ui, "Segoe UI Rounded", -apple-system, sans-serif !important; }
      body.app-font-condensed, .app-font-condensed { font-family: 'Roboto Condensed', "Arial Narrow", sans-serif-condensed, sans-serif !important; }
      body.app-font-slab, .app-font-slab { font-family: 'Rockwell', 'Playfair Display', Georgia, serif !important; }

      /* Dynamic Primary Color Overrides across components */
      .bg-indigo-600, .bg-indigo-700 {
        background-color: var(--app-primary) !important;
      }
      .hover\:bg-indigo-700:hover, .hover\:bg-indigo-600:hover {
        background-color: var(--app-primary-hover) !important;
      }
      .bg-indigo-50 {
        background-color: var(--app-primary-light) !important;
      }
      .text-indigo-600, .text-indigo-700 {
        color: var(--app-primary-text) !important;
      }
      .border-indigo-600 {
        border-color: var(--app-primary) !important;
      }
      .border-indigo-200 {
        border-color: var(--app-primary-light) !important;
      }
      .ring-indigo-600 {
        --tw-ring-color: var(--app-primary) !important;
      }
      .shadow-indigo-600\/20 {
        box-shadow: 0 10px 25px -5px var(--app-primary-ring) !important;
      }

      /* Theme Mode Overrides */
      html.theme-mode-parchment body {
        background-color: #faf8f5 !important;
        color: #1c1917 !important;
      }
      html.theme-mode-parchment .bg-white {
        background-color: #f3efe6 !important;
      }
      html.theme-mode-parchment .bg-slate-50 {
        background-color: #e8e2d5 !important;
      }

      html.theme-mode-dark body {
        background-color: #090d16 !important;
        color: #f1f5f9 !important;
      }
      html.theme-mode-dark .bg-white {
        background-color: #111827 !important;
        color: #f1f5f9 !important;
      }
      html.theme-mode-dark .bg-slate-50 {
        background-color: #1f2937 !important;
        color: #f8fafc !important;
      }
      html.theme-mode-dark .bg-slate-100 {
        background-color: #374151 !important;
      }
      html.theme-mode-dark .text-slate-900 {
        color: #f8fafc !important;
      }
      html.theme-mode-dark .text-slate-800 {
        color: #f1f5f9 !important;
      }
      html.theme-mode-dark .text-slate-700 {
        color: #e2e8f0 !important;
      }
      html.theme-mode-dark .border-slate-100,
      html.theme-mode-dark .border-slate-200 {
        border-color: #1e293b !important;
      }

      /* Neo 3D Mode */
      html.theme-mode-neo body {
        background-color: #e6ecf5 !important;
        color: #1e293b !important;
      }
      html.theme-mode-neo .bg-white {
        background-color: #e6ecf5 !important;
        box-shadow: 6px 6px 14px #c2c9d6, -6px -6px 14px #ffffff !important;
        border-radius: 1rem !important;
        border: 1px solid rgba(255,255,255,0.6) !important;
      }
      html.theme-mode-neo .bg-slate-50 {
        background-color: #dce3ee !important;
      }

      /* 3D Glass Mode */
      html.theme-mode-glass body {
        background: linear-gradient(135deg, #0b0f19 0%, #1e1b4b 50%, #2e103f 100%) fixed !important;
        color: #f8fafc !important;
      }
      html.theme-mode-glass .bg-white {
        background: rgba(255, 255, 255, 0.07) !important;
        backdrop-filter: blur(18px) !important;
        -webkit-backdrop-filter: blur(18px) !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        color: #f8fafc !important;
        box-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.35) !important;
      }
      html.theme-mode-glass .bg-slate-50 {
        background: rgba(255, 255, 255, 0.05) !important;
        color: #f1f5f9 !important;
      }
      html.theme-mode-glass .text-slate-900,
      html.theme-mode-glass .text-slate-800,
      html.theme-mode-glass .text-slate-700 {
        color: #f8fafc !important;
      }
      html.theme-mode-glass .border-slate-100,
      html.theme-mode-glass .border-slate-200 {
        border-color: rgba(255, 255, 255, 0.12) !important;
      }
      
      /* Standardized Compact Mode Data Table Utilities */
      .compact-mode table th,
      .compact-mode table td,
      table.compact-mode th,
      table.compact-mode td,
      .compact-mode th,
      .compact-mode td {
        padding-top: 0.15rem !important;  /* py-0.5 */
        padding-bottom: 0.15rem !important; /* py-0.5 */
        padding-left: 0.35rem !important;  /* px-1.5 */
        padding-right: 0.35rem !important; /* px-1.5 */
        font-size: 0.68rem !important;   /* text-[11px] */
        line-height: 0.85rem !important;
      }
      .compact-mode tr, table.compact-mode tr {
        height: auto !important;
        min-height: unset !important;
      }
      .compact-mode .py-3, .compact-mode .py-4, .compact-mode .py-3\.5, .compact-mode .py-2\.5 {
        padding-top: 0.15rem !important;
        padding-bottom: 0.15rem !important;
      }
      .compact-mode .p-4, .compact-mode .p-3 {
        padding: 0.25rem !important;
      }

      /* Fix sticky table headers and sector header row offsets to prevent client name overlapping and layout conflicts */
      .compact-mode .sticky.top-\[27px\] {
        top: 21px !important;
      }
      :not(.compact-mode) .sticky.top-\[27px\],
      table:not(.compact-mode) .sticky.top-\[27px\] {
        top: 36px !important;
      }

      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 10s linear infinite;
      }
      .animate-spin-slow:hover {
        animation-duration: 3s;
      }

      .traffic-red { background-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
      .traffic-amber { background-color: #f59e0b; box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
      .traffic-green { background-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }

      /* GST & IT Portfolio Tables - Dynamic Font Sizing & Row Padding Customizer support */
      .gst-portfolio-table,
      .it-portfolio-table,
      .itr-returns-table,
      .tax-audit-table,
      .monthly-returns-table,
      .quarterly-returns-table,
      .composition-returns-table,
      .gstr4-returns-table,
      .gstr9-returns-table {
        width: 100% !important;
        border-collapse: collapse !important;
        font-size: var(--app-font-size, 0.875rem) !important;
      }
      .gst-portfolio-table th,
      .it-portfolio-table th,
      .itr-returns-table th,
      .tax-audit-table th,
      .monthly-returns-table th,
      .quarterly-returns-table th,
      .composition-returns-table th,
      .gstr4-returns-table th,
      .gstr9-returns-table th {
        font-size: var(--app-font-size, 0.875rem) !important;
        font-weight: 700 !important;
        padding-top: 6px !important;
        padding-bottom: 6px !important;
        padding-left: 12px !important;
        padding-right: 12px !important;
        line-height: 1.5 !important;
      }
      .gst-portfolio-table td,
      .it-portfolio-table td,
      .itr-returns-table td,
      .tax-audit-table td,
      .monthly-returns-table td,
      .quarterly-returns-table td,
      .composition-returns-table td,
      .gstr4-returns-table td,
      .gstr9-returns-table td {
        font-size: var(--app-font-size, 0.875rem) !important;
        padding-top: 6px !important;
        padding-bottom: 6px !important;
        padding-left: 12px !important;
        padding-right: 12px !important;
        line-height: 1.5 !important;
      }
      .gst-portfolio-table td p,
      .gst-portfolio-table td span,
      .gst-portfolio-table td div,
      .it-portfolio-table td p,
      .it-portfolio-table td span,
      .it-portfolio-table td div,
      .itr-returns-table td p,
      .itr-returns-table td span,
      .itr-returns-table td div,
      .itr-returns-table td input,
      .tax-audit-table td p,
      .tax-audit-table td span,
      .tax-audit-table td div,
      .tax-audit-table td input,
      .monthly-returns-table td p,
      .monthly-returns-table td span,
      .monthly-returns-table td div,
      .monthly-returns-table td input,
      .it-portfolio-table td input,
      .quarterly-returns-table td p,
      .quarterly-returns-table td span,
      .quarterly-returns-table td div,
      .quarterly-returns-table td input,
      .composition-returns-table td p,
      .composition-returns-table td span,
      .composition-returns-table td div,
      .composition-returns-table td input,
      .gstr4-returns-table td p,
      .gstr4-returns-table td span,
      .gstr4-returns-table td div,
      .gstr4-returns-table td input,
      .gstr9-returns-table td p,
      .gstr9-returns-table td span,
      .gstr9-returns-table td div,
      .gstr9-returns-table td input {
        font-size: inherit !important;
      }
      /* Specifically, the Trade subtitle under IT Portfolio name should be slightly smaller for elegant hierarchy */
      .it-portfolio-table td p.trade-subtitle,
      .itr-returns-table td p.trade-subtitle,
      .tax-audit-table td p.trade-subtitle {
        font-size: 12px !important;
        color: #4f46e5 !important; /* Elegant indigo-600 with good contrast */
        font-weight: 500 !important;
      }
      /* Monthly & Quarterly returns legal name subtitle style and Father Name subtitle */
      .itr-returns-table td p.father-subtitle {
        font-size: 12px !important;
        color: #64748b !important; /* text-slate-500 */
        font-weight: 500 !important;
      }
      .monthly-returns-table td p.legal-subtitle,
      .quarterly-returns-table td p.legal-subtitle,
      .composition-returns-table td p.legal-subtitle,
      .gstr4-returns-table td p.legal-subtitle,
      .gstr9-returns-table td p.legal-subtitle,
      .itr-returns-table td p.legal-subtitle,
      .tax-audit-table td p.legal-subtitle {
        font-size: 12px !important;
        color: #64748b !important; /* text-slate-500 */
        font-weight: 500 !important;
      }
    </style>

</head>
  <body class="app-font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
