<!DOCTYPE html>
<html lang="en" class="font-sans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Clientify | Practice Intelligence Operating System</title>
    <meta name="description" content="Master your practice with Clientify. The high-performance vault for professional tax consultants." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Quicksand:wght@500;700;800&family=Roboto+Condensed:wght@400;700;900&family=Playfair+Display:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: 'var(--app-primary, #4f46e5)',
              secondary: 'var(--app-primary-hover, #6366f1)',
              accent: '#f59e0b',
              surface: '#ffffff',
              glass: 'rgba(255, 255, 255, 0.7)',
            },
            boxShadow: {
              'glass-silk': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
            },
            animation: {
              'pulse-priority': 'pulse-priority 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              'pulse-priority': {
                '0%, 100%': { opacity: 1, transform: 'scale(1)' },
                '50%': { opacity: .7, transform: 'scale(1.05)' },
              },
              'float': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --ui-font-size: 16px;
        --ui-font-size-num: 16;
        --app-primary: #4f46e5;
        --app-primary-hover: #4338ca;
        --app-primary-light: #e0e7ff;
        --app-primary-text: #4f46e5;
        --app-primary-ring: rgba(79, 70, 229, 0.25);
        --app-bg: #fcfdfe;
        --app-text: #0f172a;
        --app-card-bg: #ffffff;
      }
      html { font-size: var(--ui-font-size, 16px) !important; scroll-behavior: smooth; }
      body, #root {
        font-size: var(--ui-font-size, 16px) !important;
        background-color: var(--app-bg, #fcfdfe);
        color: var(--app-text, #0f172a);
        -webkit-tap-highlight-color: transparent;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      .text-\[9px\] { font-size: calc(0.5625rem * (var(--ui-font-size-num, 16) / 16)) !important; }
      .text-\[10px\] { font-size: calc(0.625rem * (var(--ui-font-size-num, 16) / 16)) !important; }
      .text-\[11px\] { font-size: calc(0.6875rem * (var(--ui-font-size-num, 16) / 16)) !important; }
      .text-\[12px\] { font-size: calc(0.75rem * (var(--ui-font-size-num, 16) / 16)) !important; }
      .text-\[13px\] { font-size: calc(0.8125rem * (var(--ui-font-size-num, 16) / 16)) !important; }
      .text-\[14px\] { font-size: calc(0.875rem * (var(--ui-font-size-num, 16) / 16)) !important; }
      .text-\[15px\] { font-size: calc(0.9375rem * (var(--ui-font-size-num, 16) / 16)) !important; }


      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.04);
      }

      /* Typography Font Styles Applicable Across Whole App */
      body.app-font-sans, .app-font-sans { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important; }
      body.app-font-serif, .app-font-serif { font-family: 'Playfair Display', ui-serif, Georgia, Cambria, "Times New Roman", Times, serif !important; }
      body.app-font-mono, .app-font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important; }
      body.app-font-rounded, .app-font-rounded { font-family: 'Quicksand', system-ui, "Segoe UI Rounded", -apple-system, sans-serif !important; }
      body.app-font-condensed, .app-font-condensed { font-family: 'Roboto Condensed', "Arial Narrow", sans-serif-condensed, sans-serif !important; }
      body.app-font-slab, .app-font-slab { font-family: 'Rockwell', 'Playfair Display', Georgia, serif !important; }

      /* Dynamic Primary Color Overrides across components */
      .bg-indigo-600, .bg-indigo-700 {
        background-color: var(--app-primary) !important;
      }
      .hover\:bg-indigo-700:hover, .hover\:bg-indigo-600:hover {
        background-color: var(--app-primary-hover) !important;
      }
      .bg-indigo-50 {
        background-color: var(--app-primary-light) !important;
      }
      .text-indigo-600, .text-indigo-700 {
        color: var(--app-primary-text) !important;
      }
      .border-indigo-600 {
        border-color: var(--app-primary) !important;
      }
      .border-indigo-200 {
        border-color: var(--app-primary-light) !important;
      }
      .ring-indigo-600 {
        --tw-ring-color: var(--app-primary) !important;
      }
      .shadow-indigo-600\/20 {
        box-shadow: 0 10px 25px -5px var(--app-primary-ring) !important;
      }

      /* Theme Mode Overrides */
      html.theme-mode-parchment body {
        background-color: #faf8f5 !important;
        color: #1c1917 !important;
      }
      html.theme-mode-parchment .bg-white {
        background-color: #f3efe6 !important;
      }
      html.theme-mode-parchment .bg-slate-50 {
        background-color: #e8e2d5 !important;
      }

      html.theme-mode-dark body {
        background-color: #090d16 !important;
        color: #f1f5f9 !important;
      }
      html.theme-mode-dark .bg-white {
        background-color: #111827 !important;
        color: #f1f5f9 !important;
      }
      html.theme-mode-dark .bg-slate-50 {
        background-color: #1f2937 !important;
        color: #f8fafc !important;
      }
      html.theme-mode-dark .bg-slate-100 {
        background-color: #374151 !important;
      }
      html.theme-mode-dark .text-slate-900 {
        color: #f8fafc !important;
      }
      html.theme-mode-dark .text-slate-800 {
        color: #f1f5f9 !important;
      }
      html.theme-mode-dark .text-slate-700 {
        color: #e2e8f0 !important;
      }
      html.theme-mode-dark .border-slate-100,
      html.theme-mode-dark .border-slate-200 {
        border-color: #1e293b !important;
      }
      
      .traffic-red { background-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
      .traffic-amber { background-color: #f59e0b; box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
      .traffic-green { background-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "socket.io-client": "https://esm.sh/socket.io-client@^4.8.3",
    "dotenv/": "https://esm.sh/dotenv@^17.2.3/",
    "http": "https://esm.sh/http@^0.0.1-security",
    "express": "https://esm.sh/express@^5.2.1",
    "cors": "https://esm.sh/cors@^2.8.5",
    "path": "https://esm.sh/path@^0.12.7",
    "url": "https://esm.sh/url@^0.11.4",
    "mongodb": "https://esm.sh/mongodb@^7.0.0",
    "socket.io": "https://esm.sh/socket.io@^4.8.3",
    "jsonwebtoken": "https://esm.sh/jsonwebtoken@^9.0.3",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0"
  }
}
</script>
</head>
  <body class="app-font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW ref fail', err));
        });
      }
    </script>
  </body>
</html>
